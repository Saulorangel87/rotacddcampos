version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: rotas_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rotas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rotas_network
    # Sem "ports:" aqui de propósito — o Postgres não precisa ficar exposto
    # pra fora do Docker, só a API (no mesmo network) precisa falar com ele.

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: rotas_api
    restart: always
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: rotas_db
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - rotas_network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: rotas_frontend
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - api
    networks:
      - rotas_network

volumes:
  postgres_data:

networks:
  rotas_network:
    driver: bridge
