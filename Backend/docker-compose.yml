version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: rotas_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rotas_entrega
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rotas_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotas_api
    restart: always
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: rotas_entrega
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - rotas_network

volumes:
  postgres_data:

networks:
  rotas_network:
    driver: bridge
