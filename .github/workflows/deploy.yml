name: Deploy Produção (VPS)

# Disparo manual — aparece um botão "Run workflow" na aba Actions do GitHub.
# Nada é publicado automaticamente a cada push; você escolhe quando.
on:
  workflow_dispatch:

jobs:
  build-check:
    name: Checar build (Backend + Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: Backend/go.sum

      - name: Compilar Backend (Go)
        working-directory: Backend
        run: go build ./...

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependências do Frontend
        working-directory: Frontend
        run: npm ci

      - name: Buildar Frontend (React)
        working-directory: Frontend
        run: npm run build

  deploy:
    name: Deploy na VPS
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Conectar à rede privada Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VPS_HOST }}

      - name: Conectar na VPS e publicar
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd ~/apps/site-correios
            git pull --ff-only origin main
            docker compose up -d --build
