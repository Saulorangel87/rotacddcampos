<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Revisão de ruas — OpenStreetMap</title>
<style>
  :root {
    --azul: #005DAA;
    --azul-escuro: #003d73;
    --amarelo: #FFD400;
    --cinza-950: #14181f;
    --cinza-800: #333c47;
    --cinza-600: #5b6570;
    --cinza-300: #cdd3da;
    --cinza-100: #f0f2f5;
    --branco: #ffffff;
    --verde: #1a7d3f;
    --verde-bg: #e7f6ec;
    --vermelho: #b3261e;
    --vermelho-bg: #fdecea;
    --raio: 14px;
    --raio-sm: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    background: var(--cinza-100);
    color: var(--cinza-950);
  }
  .app { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  .topo {
    background: var(--azul);
    color: white;
    margin: -20px -16px 20px;
    padding: 18px 16px 16px;
    border-radius: 0 0 var(--raio) var(--raio);
  }
  .topo h1 { font-size: 1.05rem; margin: 0 0 2px; font-weight: 800; }
  .topo p { margin: 0; font-size: 0.78rem; opacity: 0.85; }

  .progresso-barra {
    height: 8px;
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progresso-preenchido {
    height: 100%;
    background: var(--amarelo);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .progresso-legenda {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    margin-top: 6px;
    opacity: 0.9;
  }

  .card {
    background: var(--branco);
    border-radius: var(--raio);
    padding: 20px;
    box-shadow: 0 1px 3px rgba(20,24,31,0.08);
    margin-bottom: 16px;
  }

  .confianca-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--cinza-100);
    color: var(--cinza-600);
    margin-bottom: 12px;
  }
  .confianca-badge[data-nivel="alta"] { background: var(--verde-bg); color: var(--verde); }
  .confianca-badge[data-nivel="media"] { background: #fff6e0; color: #8a6300; }

  .comparacao {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .comparacao .lado h3 {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--cinza-600);
    margin: 0 0 6px;
    font-weight: 700;
  }
  .comparacao .lado .valor {
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.3;
  }
  .comparacao .seta { color: var(--cinza-300); font-size: 1.3rem; }

  .lista-itens { list-style: none; margin: 0 0 16px; padding: 0; border-top: 1px solid var(--cinza-100); }
  .lista-itens li {
    padding: 10px 0;
    border-bottom: 1px solid var(--cinza-100);
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }
  .lista-itens li .texto { flex: 1; min-width: 0; }
  .lista-itens li span.pct { font-size: 0.72rem; color: var(--cinza-600); white-space: nowrap; }
  .item-acoes { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .item-btn {
    border: 1px solid var(--cinza-300);
    background: var(--branco);
    border-radius: 999px;
    width: 30px; height: 30px;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .item-btn[data-ativo="aceito"] { background: var(--verde-bg); border-color: var(--verde); }
  .item-btn[data-ativo="rejeitado"] { background: var(--vermelho-bg); border-color: var(--vermelho); }

  .acoes { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: var(--raio-sm);
    padding: 13px 14px;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .btn-aceitar { background: var(--verde); color: white; }
  .btn-rejeitar { background: var(--vermelho-bg); color: var(--vermelho); }
  .btn-pular { background: var(--cinza-100); color: var(--cinza-600); flex: 0 0 auto; padding: 13px 16px; }

  .rodape-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .link-sutil {
    background: none; border: none; color: var(--cinza-600); font-size: 0.78rem;
    cursor: pointer; text-decoration: underline; padding: 6px 0;
  }

  .fim {
    text-align: center;
    padding: 40px 20px;
  }
  .fim .emoji { font-size: 2.4rem; }
  .fim h2 { margin: 10px 0 4px; }
  .fim p { color: var(--cinza-600); font-size: 0.88rem; }

  .resumo-numeros { display: flex; gap: 12px; justify-content: center; margin: 20px 0; }
  .resumo-numeros div { background: var(--cinza-100); border-radius: var(--raio-sm); padding: 12px 18px; text-align: center; }
  .resumo-numeros strong { display: block; font-size: 1.3rem; }
  .resumo-numeros span { font-size: 0.7rem; color: var(--cinza-600); }

  textarea {
    width: 100%;
    height: 160px;
    font-family: ui-monospace, monospace;
    font-size: 0.72rem;
    border-radius: var(--raio-sm);
    border: 1px solid var(--cinza-300);
    padding: 10px;
    resize: vertical;
  }

  .btn-primario {
    background: var(--azul);
    color: white;
    border: none;
    border-radius: var(--raio-sm);
    padding: 12px 20px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    margin: 6px 6px 0 0;
  }
  .btn-secundario {
    background: var(--branco);
    color: var(--cinza-800);
    border: 1px solid var(--cinza-300);
    border-radius: var(--raio-sm);
    padding: 12px 20px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    margin: 6px 6px 0 0;
  }

  .revisar-lista { margin-top: 24px; }
  .revisar-lista h3 { font-size: 0.85rem; }
  .revisar-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--cinza-100); font-size: 0.8rem;
  }
  .tag-decisao { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .tag-decisao[data-d="aceito"] { background: var(--verde-bg); color: var(--verde); }
  .tag-decisao[data-d="rejeitado"] { background: var(--vermelho-bg); color: var(--vermelho); }
  .tag-decisao[data-d="misto"] { background: #fff6e0; color: #8a6300; }
  .mini-btn { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 2px 6px; }

  .aviso-erro {
    background: var(--vermelho-bg); color: var(--vermelho);
    border-radius: var(--raio-sm); padding: 10px 12px; font-size: 0.8rem; margin-bottom: 12px;
  }
</style>
</head>

fiancaMedia": 0.6, "itens": [{"ruaId": 1158, "nomeBanco": "CARAMURU, RUA", "confianca": 0.6}]}, {"nomeOsm": "LUIZ FARIA DE AZEVEDO", "confiancaMedia": 0.6, "itens": [{"ruaId": 2100, "nomeBanco": "RUA CALIFÓRNIA - TRAVESSÃO", "confianca": 0.6}]}, {"nomeOsm": "HUMBERTO FELISBERTO", "confiancaMedia": 0.6, "itens": [{"ruaId": 2112, "nomeBanco": "RUA HUMBERTO CLAÚDIO FELISBERTO LIMA - TRAVESSÃO", "confianca": 0.6}]}, {"nomeOsm": "ANTONIO DE SOUZA GOMES", "confiancaMedia": 0.6, "itens": [{"ruaId": 2126, "nomeBanco": "RUA NILO DE SOUZA PINTO - TRAVESSÃO", "confianca": 0.6}]}, {"nomeOsm": "MATA DA CANOA", "confiancaMedia": 0.6, "itens": [{"ruaId": 2252, "nomeBanco": "RUA TRÊS - NOVA CANAÃ", "confianca": 0.6}]}, {"nomeOsm": "VALADARES RANGEL", "confiancaMedia": 0.6, "itens": [{"ruaId": 2139, "nomeBanco": "TRAVESSA LUIZ VALADARES -  TRAVESSÃO", "confianca": 0.6}]}, {"nomeOsm": "RANGEL", "confiancaMedia": 0.6, "itens": [{"ruaId": 1609, "nomeBanco": "TRAVESSA NELY", "confianca": 0.6}]}, {"nomeOsm": "PETRO UBALDI", "confiancaMedia": 0.6, "itens": [{"ruaId": 186, "nomeBanco": "TRAVESSA PETRUCCI", "confianca": 0.6}]}];

const CHAVE_STORAGE = "decisoes_revisao_osm";

let decisoes = {}; // ruaId -> "aceito" | "rejeitado"
let indiceAtual = 0;
let carregado = false;

function grupoStatus(grupo) {
  const statusItens = grupo.itens.map((i) => decisoes[i.ruaId]);
  if (statusItens.every((s) => s === "aceito" || s === "rejeitado")) return "decidido";
  return "pendente";
}

function proximoGrupoPendenteDesde(i) {
  for (let k = i; k < DADOS.length; k++) {
    if (grupoStatus(DADOS[k]) === "pendente") return k;
  }
  for (let k = 0; k < i; k++) {
    if (grupoStatus(DADOS[k]) === "pendente") return k;
  }
  return -1;
}

function salvar() {
  try {
    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(decisoes));
  } catch (e) {
    console.warn("falha ao salvar progresso (o navegador pode estar bloqueando localStorage pra arquivos locais):", e);
    alert("Não consegui salvar o progresso automaticamente. Baixe as decisões com frequência pra não perder nada (botão aparece no fim, ou force pelo console).");
  }
}

async function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE_STORAGE);
    if (bruto) decisoes = JSON.parse(bruto);
  } catch (e) {
    // sem progresso salvo ainda, ou localStorage bloqueado — tudo bem, começa do zero
  }
  carregado = true;
}

function contarDecididos() {
  return DADOS.filter((g) => grupoStatus(g) === "decidido").length;
}

function nivelConfianca(c) {
  return c >= 0.75 ? "alta" : "media";
}

function decidirGrupo(grupo, decisao) {
  grupo.itens.forEach((i) => { decisoes[i.ruaId] = decisao; });
  salvar();
  const proximo = proximoGrupoPendenteDesde(indiceAtual + 1);
  indiceAtual = proximo === -1 ? indiceAtual : proximo;
  render();
}

function pular() {
  const proximo = proximoGrupoPendenteDesde(indiceAtual + 1);
  if (proximo !== -1) indiceAtual = proximo;
  render();
}

function avancar() {
  const proximo = proximoGrupoPendenteDesde(indiceAtual + 1);
  indiceAtual = proximo === -1 ? indiceAtual : proximo;
  render();
}

function alternarItem(ruaId, nova) {
  decisoes[ruaId] = nova;
  salvar();
  render();
}

function limparTudo() {
  if (!confirm("Isso apaga todas as decisões salvas e recomeça do zero. Confirma?")) return;
  decisoes = {};
  indiceAtual = 0;
  salvar();
  render();
}

function exportarJson() {
  const linhas = [];
  DADOS.forEach((g) => {
    g.itens.forEach((i) => {
      const d = decisoes[i.ruaId];
      if (d === "aceito" || d === "rejeitado") {
        linhas.push({ rua_id: i.ruaId, nome_osm: g.nomeOsm, decisao: d });
      }
    });
  });
  return JSON.stringify(linhas, null, 2);
}

function baixarJson() {
  const conteudo = exportarJson();
  const blob = new Blob([conteudo], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "decisoes_revisao_osm.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copiarJson() {
  const ta = document.getElementById("export-textarea");
  ta.select();
  navigator.clipboard?.writeText(ta.value).catch(() => {});
}

function render() {
  const root = document.getElementById("root");
  const decididos = contarDecididos();
  const total = DADOS.length;
  const pct = total ? Math.round((decididos / total) * 100) : 0;

  const topo = `
    <div class="topo">
      <h1>Revisão de ruas — OpenStreetMap</h1>
      <p>Confirme se o nome batido pelo script é a mesma rua do banco</p>
      <div class="progresso-barra"><div class="progresso-preenchido" style="width:${pct}%"></div></div>
      <div class="progresso-legenda"><span>${decididos} de ${total} grupos</span><span>${pct}%</span></div>
      <button class="link-sutil" style="color:white;opacity:0.85;margin-top:8px;" onclick="baixarJson()">💾 Baixar progresso agora (backup)</button>
    </div>
  `;

  if (!carregado) {
    root.innerHTML = topo + `<div class="card">Carregando…</div>`;
    return;
  }

  if (decididos >= total) {
    const todosItens = DADOS.flatMap((g) => g.itens.map((i) => decisoes[i.ruaId]));
    const aceitos = todosItens.filter((d) => d === "aceito").length;
    const rejeitados = todosItens.filter((d) => d === "rejeitado").length;
    root.innerHTML = topo + `
      <div class="card fim">
        <div class="emoji">🎉</div>
        <h2>Revisão concluída</h2>
        <p>Todos os ${total} grupos foram decididos.</p>
        <div class="resumo-numeros">
          <div><strong>${aceitos}</strong><span>aceitos</span></div>
          <div><strong>${rejeitados}</strong><span>rejeitados</span></div>
        </div>
        <div>
          <button class="btn-primario" onclick="baixarJson()">⬇️ Baixar decisões (JSON)</button>
          <button class="btn-secundario" onclick="document.getElementById('area-export').style.display='block'">Ver / copiar texto</button>
        </div>
        <div id="area-export" style="display:none; text-align:left; margin-top:16px;">
          <textarea id="export-textarea" readonly>${exportarJson()}</textarea>
          <button class="btn-secundario" onclick="copiarJson()">📋 Copiar</button>
        </div>
      </div>
      ${renderRevisarLista()}
    `;
    return;
  }

  const grupo = DADOS[indiceAtual];
  const nivel = nivelConfianca(grupo.confiancaMedia);
  const todosDecididos = grupo.itens.every((i) => decisoes[i.ruaId] === "aceito" || decisoes[i.ruaId] === "rejeitado");
  const itensHtml = grupo.itens.map((i) => {
    const d = decisoes[i.ruaId] || "";
    return `
    <li>
      <span class="texto">${escapeHtml(i.nomeBanco)} <span class="pct">${Math.round(i.confianca * 100)}%</span></span>
      <span class="item-acoes">
        <button class="item-btn" data-ativo="${d === "aceito" ? "aceito" : ""}" title="Essa é a mesma rua" onclick="alternarItem(${i.ruaId}, 'aceito')">✅</button>
        <button class="item-btn" data-ativo="${d === "rejeitado" ? "rejeitado" : ""}" title="Essa não é a mesma rua" onclick="alternarItem(${i.ruaId}, 'rejeitado')">❌</button>
      </span>
    </li>`;
  }).join("");

  root.innerHTML = topo + `
    <div class="card">
      <span class="confianca-badge" data-nivel="${nivel}">Confiança ${Math.round(grupo.confiancaMedia * 100)}%</span>

      <div class="comparacao">
        <div class="lado">
          <h3>No banco (${grupo.itens.length} trecho${grupo.itens.length > 1 ? "s" : ""})</h3>
          <div class="valor">${escapeHtml(grupo.itens[0].nomeBanco.split(" - ")[0])}</div>
        </div>
        <div class="seta">→</div>
        <div class="lado">
          <h3>Sugestão OpenStreetMap</h3>
          <div class="valor">${escapeHtml(grupo.nomeOsm)}</div>
        </div>
      </div>

      ${grupo.itens.length > 1 ? `<p style="font-size:0.76rem;color:var(--cinza-600);margin:0 0 10px;">
        ${grupo.itens.length} trechos caíram nessa mesma sugestão — se algum não for de verdade a mesma rua, use o ✅/❌ individual dele em vez do botão de baixo.
      </p>` : ""}

      <ul class="lista-itens">${itensHtml}</ul>

      <div class="acoes">
        <button class="btn btn-aceitar" onclick="decidirGrupo(DADOS[${indiceAtual}], 'aceito')">✅ Todos são a mesma rua</button>
        <button class="btn btn-rejeitar" onclick="decidirGrupo(DADOS[${indiceAtual}], 'rejeitado')">❌ Nenhum é</button>
      </div>
      <div class="acoes" style="margin-top:10px;">
        <button class="btn btn-pular" onclick="pular()" style="flex:1;">Pular por agora</button>
        ${todosDecididos ? `<button class="btn btn-aceitar" onclick="avancar()">Avançar →</button>` : ""}
      </div>
    </div>
    ${renderRevisarLista()}
  `;
}

function renderRevisarLista() {
  const decididosList = DADOS.filter((g) => grupoStatus(g) === "decidido");
  if (decididosList.length === 0) return "";
  const itens = decididosList.slice(-8).reverse().map((g) => {
    const valores = new Set(g.itens.map((i) => decisoes[i.ruaId]));
    const d = valores.size > 1 ? "misto" : [...valores][0];
    return `
      <div class="revisar-item">
        <span>${escapeHtml(g.nomeOsm)} <span class="tag-decisao" data-d="${d}">${d}</span></span>
        <span>
          <button class="mini-btn" title="Reabrir pra revisar" onclick="reabrirGrupo('${escapeHtml(g.nomeOsm).replace(/'/g, "\\'")}')">↺</button>
        </span>
      </div>
    `;
  }).join("");
  return `
    <div class="card revisar-lista">
      <h3>Últimas decisões</h3>
      ${itens}
      <button class="link-sutil" onclick="limparTudo()">Recomeçar tudo do zero</button>
    </div>
  `;
}

function reabrirGrupo(nomeOsm) {
  const idx = DADOS.findIndex((g) => g.nomeOsm === nomeOsm);
  if (idx === -1) return;
  DADOS[idx].itens.forEach((i) => { delete decisoes[i.ruaId]; });
  salvar();
  indiceAtual = idx;
  render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

(async function iniciar() {
  await carregar();
  const primeiroPendente = proximoGrupoPendenteDesde(0);
  indiceAtual = primeiroPendente === -1 ? 0 : primeiroPendente;
  render();
})();
</script>
