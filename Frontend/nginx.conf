server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bloqueia explicitamente arquivos sensíveis — por precaução, mesmo que
    # o Nginx já retorne o index.html (comportamento normal de SPA) pra esses
    # caminhos. Assim retorna 404 real em vez de 200 com HTML.
    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
    location = /.env { deny all; return 404; }

    # sw.js e manifest.json revalidados sempre (nunca em cache agressivo)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html sempre revalidado
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Imagens estáticas da pasta /images/ (favicon, logo, ícones PWA)
    # Não passam pelo hash do Vite, então cache mais curto (1 dia)
    location ^~ /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Assets do Vite têm hash no nome — cache longo e imutable
    location ~* \.(js|css|woff2?|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
