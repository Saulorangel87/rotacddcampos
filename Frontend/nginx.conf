server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sw.js e manifest.json precisam sempre ser revalidados — se o navegador
    # cachear o sw.js antigo, o site nunca recebe atualizações do Service
    # Worker (ele compara byte a byte com o arquivo servido pelo Nginx).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html também sempre revalidado — é o "casco" que carrega o resto.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # JS/CSS gerados pelo Vite têm hash no nome do arquivo — se o conteúdo
    # muda, o nome muda junto, então cache longo aqui é seguro de verdade.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
